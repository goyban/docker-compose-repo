# copyparty configuration. Everything in /cfg is loaded by the image's own
# initcfg, which also sets `chdir: /w`.
#
# Not YAML despite appearances -- indentation matters, `key: value` for options
# that take one, bare words for flags.
#
# Inline comments need AT LEAST TWO SPACES before the `#`. With one space the
# `#` and everything after it becomes part of the value, and copyparty warns
# about it at startup rather than failing.
#
# No [accounts] section here on purpose: accounts are passed on the command
# line from .env, so no password is ever committed. See compose.yaml.

[global]
  e2dsa             # index files and scan the filesystem
  e2ts              # read media tags; needs the "ac" image, which has ffmpeg

  # Keep the index out of the shared folder. Without this, copyparty creates
  # a .hist directory inside whatever you are sharing.
  hist: /data/hist

  # ipa: lan        # reject connections from outside the LAN
  # df: 16          # refuse uploads when under 16 GB free
  # grid            # thumbnail grid by default
  # theme: 2        # monokai

  # Warn -- and with vc-exit, refuse to start -- if the running version has a
  # known advisory. Off by default upstream; worth it for anything exposed.
  # vc-url: https://api.copyparty.eu/advisories
  # vc-exit

[/]                 # volume at the webroot
  /w                # serving /w, which compose binds to your SHARE_PATH
  accs:
    # Upstream's example uses `rw: *`, i.e. read-write for anonymous visitors.
    # That is a reasonable LAN dropbox and a bad default for anything else, so
    # only the account created in compose.yaml gets access here.
    rwmda: admin    # read-write-move-delete-admin
  flags:
    e2ds
