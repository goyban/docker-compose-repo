name: openwebui
services:
    open-webui:
        ports:
            - 3033:8080
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - ./open-webui:/app/backend/data
        container_name: open-webui
        restart: always
        image: ghcr.io/open-webui/open-webui:main
volumes:
    open-webui:
        external: true
        name: open-webui
