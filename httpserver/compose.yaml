services:
  nginx:
    image: nginx:latest
    container_name: nginx-webserver
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./init/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TEMPDISK}/Temp:/usr/share/nginx/html
    ports:
      - 8083:80
    restart: unless-stopped
