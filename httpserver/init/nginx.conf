events {}
http {
    # Without these every file except .html/.gif/.jpg is served as text/plain,
    # from nginx's tiny built-in table. Old browsers then try to *display* a
    # .zip or .exe instead of offering to save it. Parsed once at startup --
    # no per-request cost, and mime.types already ships in the image.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        location / {
            autoindex on;
            root /usr/share/nginx/html;
        }
    }
}

